server {
    listen 80;
    server_name _; # Replace with your Public IP or domain name later

    # Root directory for your React frontend build
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 1. DJANGO STATIC FILES (The "Ghost CSS" Fix)
    # The ^~ modifier gives this priority over the regex cache block below
    location ^~ /static/ {
        alias /app/staticfiles/; 
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. DJANGO MEDIA FILES (For any uploaded SME documents/images)
    location /media/ {
        alias /app/media/;
    }

    # 3. DJANGO API PROXY
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. REACT ROUTER
    # Send all non-file requests to index.html so React can handle the routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. GENERAL ASSET CACHING
    # Caches images and fonts aggressively for better performance
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}